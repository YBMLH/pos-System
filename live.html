<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d3b31">
<!-- Added to an iPhone's home screen this opens without Safari's chrome,
     which is the only way it reads as an app rather than a web page. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shop">
<meta name="format-detection" content="telephone=no">
<title>Shop — live</title>
<style>
:root{
  --brand:#0d3b31; --brand-100:#e8f1ee; --gold:#b58a3c; --gold-soft:#f8f1e2;
  --bg:#f6f6f4; --surface:#fff; --line:#e4e4df; --text:#161614; --muted:#6c6c66;
  --ok:#1f7a4d; --warn:#b58a3c; --danger:#b3261e; --radius:14px;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
  --bg:#14150f; --surface:#1d1e18; --line:#30312a; --text:#f0efe9; --muted:#a3a39a;
  --brand:#2f7f6a; --brand-100:#1c2a26; --gold-soft:#2a2418;
}}
:root[data-theme="dark"]{
  --bg:#14150f; --surface:#1d1e18; --line:#30312a; --text:#f0efe9; --muted:#a3a39a;
  --brand:#2f7f6a; --brand-100:#1c2a26; --gold-soft:#2a2418;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:10;padding-top:max(14px,env(safe-area-inset-top))}
header b{font-size:16px;letter-spacing:.01em}
.dot{width:9px;height:9px;border-radius:50%;background:#9aa;flex:none}
.dot.live{background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:p 2s infinite}
.dot.stale{background:#fbbf24}.dot.down{background:#f87171}
@keyframes p{70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.hdr-note{margin-inline-start:auto;font-size:11.5px;opacity:.85;text-align:end}
main{padding:16px;max-width:900px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.stat .v{font-size:24px;font-weight:800;margin-top:3px;white-space:nowrap}
.stat.hero{grid-column:1/-1;background:var(--brand);color:#fff;border-color:transparent}
.stat.hero .k{color:#cfe6de}.stat.hero .v{font-size:38px;line-height:1.1}
.stat.gold{background:var(--gold-soft);border-color:#e6d6b0}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.hero .sub{color:#cfe6de}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{min-width:0;flex:1}
.row .t{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:11.5px;color:var(--muted);margin-top:1px}
.amt{font-weight:800;flex:none;font-size:14px}
.amt.in{color:var(--ok)}.amt.out{color:var(--danger)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--line);color:var(--text)}
.badge.red{background:#fde8e6;color:#8c1d16}.badge.green{background:#e3f3ea;color:#145c38}
.badge.gold{background:var(--gold-soft);color:#7a5c22}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .card{padding:22px}
label{display:block;font-size:12.5px;font-weight:650;margin:10px 0 4px;color:var(--muted)}
/* 16px or larger, or iOS zooms the whole page in when a field is tapped. */
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--text);font:inherit;font-size:16px;-webkit-appearance:none}
form{margin:0}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;
  font:inherit;font-weight:700;cursor:pointer;margin-top:16px}
button.ghost{background:transparent;color:var(--muted);font-weight:600;margin-top:8px}
.err{color:var(--danger);font-size:12.5px;margin-top:10px}
/* Two cards side by side on a phone leaves ~150px, which an amount like
   24,000 DZD overflows at the desktop size. */
@media (max-width:480px){ main{padding:12px} .stat{padding:12px 13px} .stat .v{font-size:20px} .stat.hero .v{font-size:32px} }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   OWNER'S LIVE VIEW — read-only, by design
   ------------------------------------------------------------
   This page never writes. It signs in, reads the rows the shop PC
   has mirrored up, and re-reads them every few seconds. The shop
   keeps running on its own machine whether this page is open,
   closed, or offline; nothing here can reach back and change it.
   The money figures are the ones the shop PC worked out, not a
   second implementation of the same rules that could drift.
============================================================ */
var CFG=null, TOK=null, TOKEXP=0, DATA={}, SUM=null, LASTOK=0, LASTROWS=-1, TIMER=null, POLL=4000;

function $(id){ return document.getElementById(id); }
/* URLs and keys reach this page through WhatsApp, email and chat apps, which
   insert zero-width and non-breaking characters at line breaks. They are
   invisible, survive a copy, and make the request illegal — fetch refuses the
   whole call with "String contains non ISO-8859-1 code point", which tells
   the owner nothing. None of these values can legitimately contain anything
   but printable ASCII, so strip the rest. */
function clean(v){ return String(v==null?'':v).replace(/[^\x21-\x7E]+/g,''); }
/* Supabase has moved its auth error text between fields over the years, and a
   reason it does give is worth far more than "refused". */
function authErr(r,j){
  var m=j&&(j.error_description||j.msg||j.message||j.error_code||j.error);
  return (m?String(m):'sign-in refused')+' ('+r.status+')';
}
function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0})+' DZD'; }
function ago(ts){
  if(!ts) return '—';
  var s=Math.round((Date.now()-ts)/1000);
  if(s<60) return s+'s ago';
  if(s<3600) return Math.round(s/60)+'m ago';
  if(s<86400) return Math.round(s/3600)+'h ago';
  return new Date(ts).toLocaleDateString();
}
function clock(ts){ if(!ts) return ''; var d=new Date(ts); return isNaN(d)?'':d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ---------- sign in ---------- */
function loadCfg(){
  try{ CFG=JSON.parse(localStorage.getItem('kf_live')||'null'); }catch(e){ CFG=null; }
  if(CFG){ CFG.url=clean(CFG.url); CFG.key=clean(CFG.key); CFG.shopId=clean(CFG.shopId); CFG.email=clean(CFG.email); }
  return CFG;
}
/* The project URL, key and shop name can ride in the link's #fragment, so the
   owner taps a link and types only their own email and password. A fragment
   never leaves the browser — it is not sent to whoever hosts this page. */
function cfgFromLink(){
  var h=(location.hash||'').replace(/^#/,''); if(!h) return null;
  var q={}; h.split('&').forEach(function(kv){ var i=kv.indexOf('=');
    if(i>0) q[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1)); });
  if(!q.u||!q.k||!q.s) return null;
  // Out of the address bar once read, so it is not left sitting in history.
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  return {url:clean(q.u),key:clean(q.k),shopId:clean(q.s),email:clean(q.e||''),password:''};
}
async function signIn(cfg){
  var base=cfg.url.replace(/\/+$/,'');
  var r=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',
    headers:{'apikey':cfg.key,'Content-Type':'application/json'},
    body:JSON.stringify({email:cfg.email,password:cfg.password})});
  var j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok || !j.access_token) throw new Error(authErr(r,j));
  TOK=j.access_token; TOKEXP=Date.now()+((j.expires_in||3600)*1000);
}
async function ensureTok(){ if(!TOK || Date.now()>TOKEXP-60000) await signIn(CFG); }

/* ---------- read ---------- */
async function pull(){
  await ensureTok();
  var base=CFG.url.replace(/\/+$/,'');
  var url=base+'/rest/v1/shop_rows?shop_id=eq.'+encodeURIComponent(CFG.shopId)
    +'&select=store,row_id,doc,deleted,updated_at&order=updated_at.asc&limit=20000';
  var r=await fetch(url,{headers:{'apikey':CFG.key,'Authorization':'Bearer '+TOK}});
  if(!r.ok) throw new Error('HTTP '+r.status+' · '+(await r.text()).slice(0,160));
  var rows=await r.json();
  var d={};
  rows.forEach(function(x){
    if(x.store==='_summary'){ if(x.row_id==='now') SUM=x.doc; return; }
    if(x.deleted) return;
    (d[x.store]=d[x.store]||[]).push(x.doc);
  });
  DATA=d; LASTROWS=rows.length; LASTOK=Date.now();
}

/* ---------- render ---------- */
function liveState(){
  if(!LASTOK) return ['down','—'];
  var age=Date.now()-LASTOK;
  if(age<POLL*3) return ['live','Live'];
  if(age<60000) return ['stale','Catching up'];
  return ['down','Not reaching the shop'];
}
/* How long since the shop PC itself last sent anything up. A page that is
   reading fine from a shop that went offline two hours ago is showing old
   news, and should say so rather than looking healthy. */
function shopAge(){ return SUM && SUM.at ? SUM.at : 0; }

function renderLogin(msg){
  var c=CFG||{};
  $('app').innerHTML=
   '<div class="login"><div class="card"><form id="l_form" autocomplete="on">'
   +'<b style="font-size:17px">Shop — live view</b>'
   +'<p style="color:var(--muted);font-size:13px;margin:6px 0 2px">Watch the shop from anywhere. This page can only look; it never changes anything.</p>'
   // Pre-filled from the link: shown but folded away, so the owner sees two
   // fields rather than five and a wall of key.
   +'<details'+(c.url&&c.key?'':' open')+' style="margin-top:4px"><summary style="cursor:pointer;color:var(--muted);font-size:12.5px;padding:6px 0">Shop connection'+(c.url&&c.key?' · set':'')+'</summary>'
   +'<label>Project URL</label><input id="l_url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://xxxx.supabase.co" value="'+esc(c.url||'')+'">'
   +'<label>Public key (anon)</label><input id="l_key" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="eyJhbGciOi…" value="'+esc(c.key||'')+'">'
   +'<label>Shop name</label><input id="l_shop" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="stylebyib" value="'+esc(c.shopId||'')+'">'
   +'</details>'
   +'<label>Your email</label><input id="l_mail" type="email" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+esc(c.email||'')+'">'
   +'<label>Your password</label><input id="l_pass" type="password" name="password" autocomplete="current-password">'
   +'<button id="l_go" type="submit">Open the shop</button>'
   +(msg?'<div class="err">'+esc(msg)+'</div>':'')
   +'</form></div></div>';
  $('l_form').onsubmit=function(e){ e.preventDefault(); };
  $('l_go').onclick=async function(e){
    if(e) e.preventDefault();
    var cfg={url:clean($('l_url').value),key:clean($('l_key').value),
      shopId:clean($('l_shop').value).toLowerCase(),
      email:clean($('l_mail').value),password:$('l_pass').value};
    if(!cfg.url||!cfg.key||!cfg.shopId||!cfg.email||!cfg.password){ renderLogin('Fill everything in.'); return; }
    $('l_go').textContent='Opening…'; $('l_go').disabled=true;
    try{ CFG=cfg; await signIn(cfg); await pull();
      localStorage.setItem('kf_live',JSON.stringify(cfg)); start();
    }catch(e){ renderLogin(String(e&&e.message||e)); }
  };
  $('l_pass').onkeydown=function(e){ if(e.key==='Enter') $('l_go').click(); };
}

function feedRows(){
  // One stream of what happened, newest first, built from the shop's own log.
  var acts=(DATA.activity||[]).slice().sort(function(a,b){ return (b.ts||0)-(a.ts||0); }).slice(0,60);
  var pays=(DATA.payments||[]).filter(function(p){ return !p.mistake; });
  var byTime={};
  // Pair each log line with the money that moved in the same second, so the
  // feed reads "returned Caftan Or  +5,000" rather than two unrelated lists.
  pays.forEach(function(p){ byTime[Math.round((p.createdAt||0)/1000)]=p; });
  return acts.map(function(a){
    var p=byTime[Math.round((a.ts||0)/1000)];
    return {t:a.detail||a.action||'', s:(a.userName||'')+' · '+clock(a.ts), amt:p?(p.amount||0):0, ts:a.ts};
  });
}
function todayLists(){
  var day=todayISO();
  var rs=(DATA.rentals||[]);
  return {
    pickups: rs.filter(function(r){ return r.status==='reserved' && r.startDate===day; }),
    drops:   rs.filter(function(r){ return r.status==='active' && r.dueDate===day; }),
    late:    rs.filter(function(r){ return r.status==='active' && r.dueDate && r.dueDate<day; })
  };
}
function render(){
  var ls=liveState(), s=SUM||{}, L=todayLists();
  var sa=shopAge(), shopQuiet = sa && (Date.now()-sa > 10*60000);
  /* Read fine, found nothing. A shop with no data and a shop name that does
     not match look identical — all zeros — so say which this is, and show the
     name being asked for, spelled out, since the character that breaks it is
     invisible by definition. */
  var emptyShop = LASTOK && LASTROWS===0;
  var html=
   '<header><span class="dot '+ls[0]+'"></span><b>'+esc(s.storeName||'Shop')+'</b>'
   +'<span class="hdr-note">'+esc(ls[1])+'<br>'+(sa?'shop sent '+esc(ago(sa)):'no data yet')+'</span></header>'
   +'<main>';
  if(emptyShop) html+='<div class="card" style="border-color:var(--danger);margin-bottom:14px">'
    +'<div class="row"><div class="main"><div class="t">Signed in, but this shop has nothing in it</div>'
    +'<div class="s">Asking for shop name <b>&laquo;'+esc(CFG.shopId)+'&raquo;</b> ('+CFG.shopId.length+' characters). '
    +'It must match the shop name on the shop PC exactly. Sign out below and type it in again if it looks right but still finds nothing — '
    +'a copied name can carry a character you cannot see.</div></div></div></div>';
  if(shopQuiet && !emptyShop) html+='<div class="card" style="border-color:var(--warn);margin-bottom:14px">'
    +'<div class="row"><div class="main"><div class="t">Nothing from the shop for '+esc(ago(sa))+'</div>'
    +'<div class="s">The figures below are from then. The shop PC is probably offline or closed — it keeps working either way and will catch up.</div></div></div></div>';

  html+='<div class="cards">'
   +'<div class="stat hero"><div class="k">Cash in the till</div><div class="v mono">'+money(s.till)+'</div>'
   +'<div class="sub">opening float '+money(s.float)+'</div></div>'
   +'<div class="stat gold"><div class="k">Caution held</div><div class="v mono">'+money(s.cautionHeld)+'</div>'
   +'<div class="sub">'+(s.liveCautions||0)+' bookings still out</div></div>'
   +'<div class="stat"><div class="k">Repair fund</div><div class="v mono">'+money(s.repairFund)+'</div></div>'
   +'<div class="stat"><div class="k">Store’s own money</div><div class="v mono">'+money(s.storeOwnCash)+'</div></div>'
   +'<div class="stat"><div class="k">Out right now</div><div class="v mono">'+(s.out||0)+'</div>'
   +'<div class="sub">'+(s.reserved||0)+' reserved ahead</div></div>'
   +'<div class="stat"><div class="k">Overdue</div><div class="v mono"'+(s.overdue?' style="color:var(--danger)"':'')+'>'+(s.overdue||0)+'</div>'
   +'<div class="sub">'+(s.dueToday||0)+' due back today</div></div>'
   +'</div>';

  function list(title,arr,fmt){
    html+='<h2>'+esc(title)+'</h2><div class="card">';
    if(!arr.length) html+='<div class="empty">Nothing</div>';
    else arr.slice(0,25).forEach(function(x){ html+=fmt(x); });
    html+='</div>';
  }
  if(L.late.length) list('Overdue', L.late, function(r){
    return '<div class="row"><div class="main"><div class="t">'+esc(r.customerName||'—')+'</div>'
      +'<div class="s">'+esc(r.name||'')+' · due '+esc(r.dueDate||'')+'</div></div>'
      +'<span class="badge red">late</span></div>'; });
  list('Coming in today', L.pickups, function(r){
    return '<div class="row"><div class="main"><div class="t">'+esc(r.customerName||'—')+'</div>'
      +'<div class="s">'+esc(r.name||'')+'</div></div><span class="badge gold">pickup</span></div>'; });
  list('Back today', L.drops, function(r){
    return '<div class="row"><div class="main"><div class="t">'+esc(r.customerName||'—')+'</div>'
      +'<div class="s">'+esc(r.name||'')+'</div></div><span class="badge green">return</span></div>'; });

  var feed=feedRows();
  html+='<h2>As it happens</h2><div class="card">';
  if(!feed.length) html+='<div class="empty">Nothing yet today</div>';
  else feed.slice(0,40).forEach(function(f){
    html+='<div class="row"><div class="main"><div class="t">'+esc(f.t)+'</div><div class="s">'+esc(f.s)+'</div></div>'
      +(f.amt?'<span class="amt '+(f.amt>0?'in':'out')+'">'+(f.amt>0?'+':'')+money(f.amt)+'</span>':'')+'</div>';
  });
  html+='</div>';
  html+='<button class="ghost" id="l_out">Sign out of this page</button></main>';
  $('app').innerHTML=html;
  $('l_out').onclick=function(){ localStorage.removeItem('kf_live'); clearInterval(TIMER); TOK=null; LASTOK=0; renderLogin(''); };
}

async function tick(){
  try{ await pull(); }catch(e){ /* a dropped connection just means older figures, not a broken page */ }
  render();
}
function start(){
  render();
  clearInterval(TIMER);
  TIMER=setInterval(tick,POLL);
  // Stop hammering the server while the phone is in a pocket.
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') tick();
  });
}
(async function(){
  // A link carrying the connection details wins over anything stored, so
  // re-sending the link is also how a changed key gets fixed.
  var fromLink=cfgFromLink();
  if(fromLink){ CFG=Object.assign(loadCfg()||{},fromLink); renderLogin(''); return; }
  if(!loadCfg()){ renderLogin(''); return; }
  renderLogin(''); // something on screen while the first read happens
  try{ await signIn(CFG); await pull(); start(); }
  catch(e){ renderLogin(String(e&&e.message||e)); }
})();
</script>
</body>
</html>
